spring.application.name=eventbook-backend
spring.datasource.url=jdbc\:mysql\://${DB_HOST\:localhost}\:${DB_PORT\:3306}/${DB_NAME\:eventbook}?createDatabaseIfNotExist\=true&useSSL\=false&serverTimezone\=UTC
spring.datasource.username=${DB_USER\:root}
spring.datasource.password=${DB_PASSWORD\:Arun@2356}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST\:localhost}
spring.data.redis.port=${REDIS_PORT\:6379}
server.port=${SERVER_PORT\:8080}
jwt.secret=${JWT_SECRET\:c2VjcmV0LWtleS1mb3ItZXZlbnRib29rLWFwcC1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1wbGVhc2U\=}
jwt.expiration-ms=${JWT_EXPIRATION_MS\:86400000}
booking.hold-duration-minutes=${HOLD_DURATION_MINUTES\:5}
logging.level.root=INFO
logging.level.com.eventbook=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH\:mm\:ss} [%thread] %-5level %logger{36} - %msg%n
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
